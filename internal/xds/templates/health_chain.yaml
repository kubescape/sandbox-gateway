# The health listener's one chain. node-agent probes these three paths to decide whether
# to keep redirecting. Each is answered by a different process, so one of them dying does
# not hide the state of the others.
name: health
filters:
- name: envoy.filters.network.http_connection_manager
  typed_config:
    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
    stat_prefix: health
    codec_type: AUTO
    http_filters:
    - name: envoy.filters.http.router
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    route_config:
      name: health
      virtual_hosts:
      - name: health
        domains: ["*"]
        routes:
        # Answered by Envoy itself.
        - match: { path: /healthz/envoy }
          direct_response: { status: 200, body: { inline_string: "ok\n" } }
        # The processor answers 503 until its policy informers have synced. The timeout
        # is under the probe's own (400 ms), so a stalled processor reads as a failure
        # here and not as a hung probe.
        - match: { path: /healthz/processor }
          route: { cluster: {{.ProcessorHealthCluster}}, timeout: 0.3s }
        # The node controller: canDecrypt, decryptValidUntil, rootFingerprint.
        - match: { path: /healthz/certs }
          route: { cluster: {{.NodeControllerCluster}}, timeout: 0.3s }
