# Per-node egress gateway, PoC config (audit only). Target: Envoy 1.38+ (tested image: 1.40.2).
#
# Flow: redirected pod connection -> PROXY v2 (identity TLVs) -> tls_inspector reads the SNI.
#   - SNI in the exact AI-host list: TLS terminated with a per-SNI leaf from the Go SDS server
#     (on_demand_secret) -> ext_proc (Go, FULL_DUPLEX_STREAMED, audit only) -> dynamic forward
#     proxy -> TLS re-originated to the real upstream.
#   - Any other SNI: passed through untouched (no MITM, no SDS), logged as TCP.
# The gate is the SNI-flood fix: an untrusted client can only make on-demand TLS fetch names on
# the list, so per-SNI SDS streams and cache entries are bounded by the list (2026-11-08).
#
# envoy.local.yaml (local compose) is generated from this file by make-local.sh.
# Edit this file, then rerun make-local.sh.

# on_demand_secret opens its SDS subscription at the first ClientHello. Without node id and
# cluster, Envoy 1.40.2 passes --mode validate but aborts the whole process (uncaught
# EnvoyException) on the first handshake. Found 2026-11-08.
node:
  id: egress-gateway-poc
  cluster: ai-sandbox-egress

# S6: the explicit-proxy listener hands CONNECT tunnels to an internal listener.
bootstrap_extensions:
- name: envoy.bootstrap.internal_listener
  typed_config:
    "@type": type.googleapis.com/envoy.extensions.bootstrap.internal_listener.v3.InternalListener

admin:
  # Loopback only. The admin interface has no authentication and can stop Envoy
  # (/quitquitquit), so nothing a pod can reach may serve it.
  address: { socket_address: { address: 127.0.0.1, port_value: 9901 } }

static_resources:
  listeners:
  - name: egress_tls
    address: { socket_address: { address: 0.0.0.0, port_value: 443 } }
    listener_filters:
    # Stage 1: the agent's connect4 redirect prepends PPv2 with the original destination and
    # pod identity. Local runs connect directly, hence allow_requests_without_proxy_protocol.
    # TLV types 0xE0-0xEF are the PPv2 custom range; the numbering is ours.
    - name: envoy.filters.listener.proxy_protocol
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.proxy_protocol.v3.ProxyProtocol
        allow_requests_without_proxy_protocol: true
        stat_prefix: egress_pp
        rules:
        - { tlv_type: 0xE0, on_tlv_present: { metadata_namespace: kubescape.sandbox.attribution, key: pod_uid } }
        - { tlv_type: 0xE1, on_tlv_present: { metadata_namespace: kubescape.sandbox.attribution, key: pid } }
        - { tlv_type: 0xE2, on_tlv_present: { metadata_namespace: kubescape.sandbox.attribution, key: proc_start_ns } }
        - { tlv_type: 0xE3, on_tlv_present: { metadata_namespace: kubescape.sandbox.attribution, key: cgroup_id } }
    - name: envoy.filters.listener.tls_inspector
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
    filter_chains:
    # MITM chain: only exact hostnames. No wildcards: *.anthropic.com would let a client mint
    # unlimited names again.
    - &mitm_chain
      filter_chain_match:
        server_names: [api.anthropic.com, api.openai.com]
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          # on_demand_secret requires both resumption modes off.
          disable_stateless_session_resumption: true
          disable_stateful_session_resumption: true
          common_tls_context:
            alpn_protocols: [h2, http/1.1]
            custom_tls_certificate_selector:
              name: envoy.tls.certificate_selectors.on_demand_secret
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.cert_selectors.on_demand_secret.v3.Config
                certificate_mapper:
                  name: envoy.tls.certificate_mappers.sni
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.cert_mappers.sni.v3.SNI
                    default_value: no-sni.invalid       # refused by the SDS server, so no-SNI handshakes fail
                # The gate lists every MITM'd name, so fetch them at startup: handshakes then
                # never wait on SDS, and keep working if the SDS server is down (2026-11-08).
                prefetch_secret_names: [api.anthropic.com, api.openai.com]
                config_source:
                  resource_api_version: V3
                  initial_fetch_timeout: 2s             # bounds the wait if the SDS server ignores a name
                  api_config_source:
                    api_type: DELTA_GRPC                # refusals come back as removed_resources
                    transport_api_version: V3
                    grpc_services: [{ envoy_grpc: { cluster_name: sds } }]
      filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: egress
          codec_type: AUTO
          upgrade_configs: [{ upgrade_type: websocket }]   # S5: does ext_proc see post-upgrade bytes?
          stream_idle_timeout: 300s
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  kind: access
                  start: "%START_TIME%"
                  request_id: "%REQ(X-REQUEST-ID)%"
                  authority: "%REQ(:AUTHORITY)%"
                  path: "%REQ(:PATH)%"
                  status: "%RESPONSE_CODE%"
                  flags: "%RESPONSE_FLAGS%"
                  duration_ms: "%DURATION%"
                  ttfb_ms: "%RESPONSE_DURATION%"
                  sni: "%REQUESTED_SERVER_NAME%"
                  downstream: "%DOWNSTREAM_REMOTE_ADDRESS%"
                  # With PPv2 this is the original destination the pod dialled.
                  orig_dst: "%DOWNSTREAM_LOCAL_ADDRESS%"
                  upstream_host: "%UPSTREAM_HOST%"
                  # PPv2 identity is connection-level metadata, which this formatter can't
                  # read (checked 2026-11-08); ext_proc copies it into kubescape.sandbox.audit.
                  pod_uid: "%DYNAMIC_METADATA(kubescape.sandbox.audit:pod_uid)%"
                  pid: "%DYNAMIC_METADATA(kubescape.sandbox.audit:pid)%"
                  rule_id: "%DYNAMIC_METADATA(kubescape.sandbox.audit:rule_id)%"
                  action: "%DYNAMIC_METADATA(kubescape.sandbox.audit:action)%"
                  model: "%DYNAMIC_METADATA(kubescape.sandbox.audit:model)%"
                  stop_reason: "%DYNAMIC_METADATA(kubescape.sandbox.audit:stop_reason)%"
                  early_eos: "%DYNAMIC_METADATA(kubescape.sandbox.audit:early_eos)%"
          http_filters:
          - name: envoy.filters.http.ext_proc
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
              grpc_service: { envoy_grpc: { cluster_name: ext_proc } }
              # false = a dead processor fails the request. A *stalled* processor in
              # FULL_DUPLEX_STREAMED has no Envoy timeout; the processor's --chunk-budget
              # watchdog ends the response fail-closed instead (AC6, 2026-11-08).
              failure_mode_allow: false
              processing_mode:
                request_header_mode: SEND
                response_header_mode: SEND
                request_body_mode: FULL_DUPLEX_STREAMED
                response_body_mode: FULL_DUPLEX_STREAMED
                request_trailer_mode: SEND
                response_trailer_mode: SEND
              # Stage 1 5-tuple path: ext_proc looks the downstream address up in the
              # redirector's pinned map.
              request_attributes: [source.address]
              metadata_options:
                forwarding_namespaces: { untyped: [kubescape.sandbox.attribution] }
                receiving_namespaces: { untyped: [kubescape.sandbox.audit] }
          - name: envoy.filters.http.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
              dns_cache_config: &dns_cache
                name: dfp_cache
                dns_lookup_family: V4_ONLY
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: egress
            # Strip alt-svc so clients never learn about HTTP/3. UDP/443 is blocked at the node.
            response_headers_to_remove: [alt-svc]
            # Ask the provider for an uncompressed response. Node clients (Claude Code) send
            # accept-encoding br and api.anthropic.com honours it, so the processor saw brotli
            # bytes and no SSE events (2026-11-10). Applied at the router, after ext_proc, so the
            # processor still records what the client asked for.
            request_headers_to_add:
            - header: { key: accept-encoding, value: identity }
              append_action: OVERWRITE_IF_EXISTS_OR_ADD
            # The dynamic forward proxy picks the upstream from the Host header, which the
            # client controls and which need not match the SNI it was decrypted for. Only the
            # decrypted names are routable: any other Host gets a 404 and never reaches an
            # upstream. Keep this list equal to server_names above.
            virtual_hosts:
            - name: ai_hosts
              domains: ["api.anthropic.com", "api.anthropic.com:443", "api.openai.com", "api.openai.com:443"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: dfp, timeout: 0s, idle_timeout: 300s }

    # Everything else: no TLS termination, no SDS. Forwarded by SNI and logged.
    # Production would use an ORIGINAL_DST cluster (the PPv2 destination) instead of trusting
    # the SNI; the PoC uses SNI DFP because local runs have no PPv2 and would loop to Envoy.
    #
    # Loop guard: the SNI is the client's, and a name that resolves to loopback makes Envoy
    # connect to this same listener, which would pass the same ClientHello through again
    # without end. A connection that arrives from loopback can only be Envoy itself, so it is
    # refused. This stops the loop; it does not stop a name that resolves to another address
    # on the node or the cluster. Forwarding to the recorded original destination closes that.
    default_filter_chain: &passthrough_chain
      filters:
      - name: envoy.filters.network.rbac
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.rbac.v3.RBAC
          stat_prefix: passthrough_loop_guard
          rules:
            action: DENY
            policies:
              from_loopback:
                permissions: [{ any: true }]
                principals: [{ direct_remote_ip: { address_prefix: 127.0.0.0, prefix_len: 8 } }]
      - name: envoy.filters.network.sni_dynamic_forward_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.sni_dynamic_forward_proxy.v3.FilterConfig
          port_value: 443
          # Its own cache: a flood of passthrough SNIs filled the shared one (max_hosts 1024)
          # and would have blocked DNS for new AI hosts on the MITM path (2026-11-08).
          dns_cache_config: &passthrough_dns
            name: passthrough_cache
            dns_lookup_family: V4_ONLY
            max_hosts: 4096
            host_ttl: 60s
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: passthrough
          cluster: dfp_passthrough
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  kind: passthrough
                  start: "%START_TIME%"
                  sni: "%REQUESTED_SERVER_NAME%"
                  downstream: "%DOWNSTREAM_REMOTE_ADDRESS%"
                  orig_dst: "%DOWNSTREAM_LOCAL_ADDRESS%"
                  upstream_host: "%UPSTREAM_HOST%"
                  flags: "%RESPONSE_FLAGS%"
                  bytes_sent: "%BYTES_SENT%"
                  bytes_received: "%BYTES_RECEIVED%"

  # S6: explicit proxy mode (HTTPS_PROXY=http://<node>:3128) as an alternative to the eBPF
  # redirect. Envoy terminates CONNECT and sends the tunnel to mitm_internal, which runs the
  # same SNI-gated MITM and passthrough chains as egress_tls. There is no PPv2 here: the pod
  # is known only by its source IP.
  - name: explicit_proxy
    address: { socket_address: { address: 0.0.0.0, port_value: 3128 } }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: explicit_proxy
          codec_type: AUTO
          http2_protocol_options: { allow_connect: true }
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  kind: connect
                  start: "%START_TIME%"
                  authority: "%REQ(:AUTHORITY)%"
                  downstream: "%DOWNSTREAM_REMOTE_ADDRESS%"
                  status: "%RESPONSE_CODE%"
                  flags: "%RESPONSE_FLAGS%"
                  duration_ms: "%DURATION%"
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          route_config:
            name: connect
            virtual_hosts:
            - name: connect
              domains: ["*"]
              routes:
              - match: { connect_matcher: {} }
                route:
                  cluster: internal_mitm
                  timeout: 0s
                  upgrade_configs: [{ upgrade_type: CONNECT, connect_config: {} }]

  - name: mitm_internal
    internal_listener: {}
    listener_filters:
    - name: envoy.filters.listener.tls_inspector
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
    filter_chains: [*mitm_chain]
    default_filter_chain: *passthrough_chain

  clusters:
  - name: internal_mitm
    load_assignment:
      cluster_name: internal_mitm
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { envoy_internal_address: { server_listener_name: mitm_internal } } } }] }]

  - name: dfp_passthrough
    lb_policy: CLUSTER_PROVIDED
    cluster_type:
      name: envoy.clusters.dynamic_forward_proxy
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
        dns_cache_config: *passthrough_dns

  - name: dfp
    lb_policy: CLUSTER_PROVIDED
    cluster_type:
      name: envoy.clusters.dynamic_forward_proxy
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
        dns_cache_config: *dns_cache
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        upstream_http_protocol_options: { auto_sni: true, auto_san_validation: true }
        auto_config: { http2_protocol_options: {}, http_protocol_options: {} }
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        common_tls_context:
          alpn_protocols: [h2, http/1.1]
          validation_context:
            trusted_ca: { filename: /etc/ssl/certs/ca-certificates.crt }

  - name: sds
    type: STATIC
    connect_timeout: 1s
    typed_extension_protocol_options: &h2_only
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: { http2_protocol_options: {} }
    load_assignment:
      cluster_name: sds
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { pipe: { path: /run/kubescape-sandbox/sds.sock } } } }] }]

  - name: ext_proc
    type: STATIC
    connect_timeout: 1s
    typed_extension_protocol_options: *h2_only
    load_assignment:
      cluster_name: ext_proc
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { pipe: { path: /run/kubescape-sandbox/extproc.sock } } } }] }]
