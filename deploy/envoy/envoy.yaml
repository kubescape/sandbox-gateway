# Envoy bootstrap for the per-node egress gateway. Floor: Envoy 1.40 (tested image: 1.40.2).
#
# This file holds only what never changes while Envoy runs: the clusters and the admin
# socket. The two listeners come from the node controller over LDS, because the set of
# decrypted hostnames and the pods on the node change all the time. The redirect listener:
#
#   redirected pod connection -> tls_inspector reads the SNI
#     - the pod's policy decrypts that name: the name's own chain terminates TLS with a
#       leaf from the node controller (SDS) -> ext_proc -> re-originated to the provider
#     - anything else from a pod on this node: passed through undecrypted, to the
#       destination the pod was connecting to
#     - a source that is no pod on this node: no chain, the connection is reset
#
# The health listener (port 18444) answers node-agent's probes, from on-node sources only:
#   /healthz/envoy by Envoy, /healthz/processor by the processor, /healthz/certs by the
#   node controller.
#
# The chains themselves are internal/xds/templates/*.yaml.

# Envoy needs both to open an xDS stream. The DaemonSet overrides the id per node with
# --service-node.
node:
  id: sandbox-gateway
  cluster: sandbox-gateway

admin:
  # A unix socket, not a port. The admin interface has no authentication and can stop
  # Envoy (/quitquitquit); on the host network a loopback port is open to every process on
  # the node. The socket lives in a directory private to the gateway pod, not in
  # /run/kubescape-sandbox, which node-agent mounts too. Mode 0660 (432): the node
  # controller, in Envoy's group, reads stats from it.
  address: { pipe: { path: /run/sandbox-gateway/envoy-admin.sock, mode: 432 } }

dynamic_resources:
  lds_config:
    resource_api_version: V3
    # Wait for the node controller without a limit. With the default (15s) an Envoy that
    # starts while the node controller is down would come up with no redirect listener
    # and look healthy; this way it serves nothing until it has its listeners.
    initial_fetch_timeout: 0s
    api_config_source:
      api_type: GRPC
      transport_api_version: V3
      grpc_services: [{ envoy_grpc: { cluster_name: xds } }]

static_resources:
  clusters:
  # Decrypted requests. The dynamic forward proxy resolves the Host header, which each
  # chain's route restricts to the chain's own name; the upstream certificate is checked
  # against that name.
  - name: dfp
    lb_policy: CLUSTER_PROVIDED
    cluster_type:
      name: envoy.clusters.dynamic_forward_proxy
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
        # Must equal the cache in internal/xds/templates/decrypt_chain.yaml.
        dns_cache_config:
          name: dfp_cache
          dns_lookup_family: V4_ONLY
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        upstream_http_protocol_options: { auto_sni: true, auto_san_validation: true }
        auto_config: { http2_protocol_options: {}, http_protocol_options: {} }
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        common_tls_context:
          alpn_protocols: [h2, http/1.1]
          validation_context:
            trusted_ca: { filename: /etc/ssl/certs/ca-certificates.crt }

  # Passthrough connections go to their original destination: the address the pod was
  # connecting to, which the listener's original_dst filter restored from the kernel's
  # connection table. A connection with no restored address is refused here.
  - name: orig_dst
    type: ORIGINAL_DST
    lb_policy: CLUSTER_PROVIDED
    connect_timeout: 5s

  # The node controller: listeners (LDS) and leaf certificates (SDS).
  - name: xds
    type: STATIC
    connect_timeout: 1s
    typed_extension_protocol_options: &h2_only
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: { http2_protocol_options: {} }
    load_assignment:
      cluster_name: xds
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { pipe: { path: /run/kubescape-sandbox/xds.sock } } } }] }]

  - name: ext_proc
    type: STATIC
    connect_timeout: 1s
    typed_extension_protocol_options: *h2_only
    load_assignment:
      cluster_name: ext_proc
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { pipe: { path: /run/kubescape-sandbox/extproc.sock } } } }] }]

  # The health listener's two routed paths. Plain HTTP/1 over each process's unix socket.
  - name: processor_health
    type: STATIC
    connect_timeout: 0.25s
    load_assignment:
      cluster_name: processor_health
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { pipe: { path: /run/kubescape-sandbox/processor-health.sock } } } }] }]

  - name: node_controller
    type: STATIC
    connect_timeout: 0.25s
    load_assignment:
      cluster_name: node_controller
      endpoints: [{ lb_endpoints: [{ endpoint: { address: { pipe: { path: /run/kubescape-sandbox/gateway.sock } } } }] }]
