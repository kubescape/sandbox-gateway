# Integration stack: the node controller image, the processor built against a stub connection
# table (test/processor-it), Envoy at the pinned version, and the mock provider. There is no eBPF
# redirect and no node-agent here, so the client dials Envoy directly and the stub table says
# which pod it is. run.sh also checks that the shipped processor image refuses to start without
# the kernel tables.
#
#   test/integration/run.sh

name: sandbox-gateway-it

services:
  node-controller:
    build: { context: ../.., dockerfile: build/Dockerfile.node-controller }
    image: sandbox-gateway/node-controller:it
    # The images run as a non-root user. Sockets are 0660 and handed to Envoy's group
    # (gid 101 in the official image), which the process must belong to.
    group_add: ["101"]
    environment:
      SANDBOX_GATEWAY_SOCKET_GID: "101"
    command: ["--gen-ca", "--listen", "unix:///run/kubescape-sandbox/sds.sock",
              "--allow-hosts", "api.anthropic.com,api.openai.com"]
    volumes:
    - run-gateway:/run/kubescape-sandbox
    - certs:/certs

  processor:
    image: sandbox-gateway/test-fixtures:it
    depends_on: [mock-anthropic]
    group_add: ["101"]
    environment:
      SANDBOX_GATEWAY_SOCKET_GID: "101"
    # PROCESSOR_MODE=--reject-all empties the stub table; run.sh sets it for one check.
    # --evaluator: a test evaluator that denies the model "denied-model" (run.sh checks it).
    command: ["processor-it", "--listen", "unix:///run/kubescape-sandbox/extproc.sock",
              "--evaluator", "--mode=enforce", "${PROCESSOR_MODE:---posture=allow}"]
    volumes:
    - run-gateway:/run/kubescape-sandbox

  # The image this repo ships. Built so run.sh can check that it will not start without the
  # pinned maps; the stack itself runs processor-it.
  processor-image:
    build: { context: ../.., dockerfile: build/Dockerfile.processor }
    image: sandbox-gateway/processor:it
    profiles: [tools]

  mock-anthropic:
    build: { context: ../.., dockerfile: test/Dockerfile }
    image: sandbox-gateway/test-fixtures:it
    command: ["mock-anthropic", "--listen", ":8080"]

  envoy:
    image: envoyproxy/envoy:${ENVOY_VERSION:-v1.40.2}
    depends_on: [node-controller, processor, mock-anthropic]
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    volumes:
    - run-gateway:/run/kubescape-sandbox
    - ./generated/envoy.yaml:/etc/envoy/envoy.yaml:ro

  client:
    image: sandbox-gateway/test-fixtures:it
    profiles: [tools]
    depends_on: [envoy]
    command: ["streamcheck", "--addr", "envoy:443", "--ca", "/certs/ca.crt"]
    volumes:
    - certs:/certs:ro

volumes:
  run-gateway: {}
  certs: {}
